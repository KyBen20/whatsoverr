<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#08090f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<title>Whatsoverr</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg0:#08090f;--glass-bg:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.09);
  --text:#eef0f8;--muted:#7a82a0;--dimmed:#424a65;
  --green:#22d372;--red:#ff4f6e;--orange:#f59e0b;--blue:#60a5fa;--purple:#a78bfa;
  --r:16px;--r-sm:10px;
}
body{background:var(--bg0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;min-height:100vh;padding-bottom:80px;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(34,211,114,0.06) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(96,165,250,0.05) 0%,transparent 60%);pointer-events:none;z-index:0;}
.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.09);border-radius:var(--r);position:relative;overflow:hidden;}
#loginPage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;background:var(--bg0);}
#loginCard{width:100%;max-width:380px;padding:44px 38px;background:rgba(255,255,255,0.05);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;}
#loginCard .logo{width:90px;height:90px;border-radius:22px;margin:0 auto 24px;display:block;object-fit:contain;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
#loginCard h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;}
#app{display:none;position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 20px 60px;}
.header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
.header img{width:56px;height:56px;border-radius:16px;object-fit:contain;box-shadow:0 6px 24px rgba(0,0,0,0.5);}
.header h1{font-size:19px;font-weight:700;letter-spacing:-.3px;}
.header-right{margin-left:auto;display:flex;gap:8px;}
.tabs{display:flex;gap:2px;margin-bottom:22px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:4px;}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;border-radius:11px;transition:.18s;}
.tab-btn.active{background:rgba(34,211,114,0.12);color:var(--green);}
.tab-pane{display:none;}.tab-pane.active{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:768px){
  .grid2{grid-template-columns:1fr;}
  .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;border-radius:0 0 0 0;border:none;border-top:1px solid rgba(255,255,255,0.09);background:rgba(8,9,15,0.85);backdrop-filter:blur(20px);z-index:90;padding-bottom:env(safe-area-inset-bottom);}
  .tab-btn{display:flex;flex-direction:column;align-items:center;padding:10px 0;font-size:11px;border-radius:8px;gap:4px;}
  .tab-btn.active{background:transparent;color:var(--green);}
}
.card{padding:22px 24px;margin-bottom:16px;}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
label.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;}
input,textarea,select{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.09);border-radius:10px;color:var(--text);padding:10px 13px;font-size:13px;margin-bottom:12px;outline:none;font-family:inherit;}
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
.input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;} .input-row>*{flex:1;min-width:150px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(34,211,114,0.13);color:var(--green);border:1px solid rgba(34,211,114,0.28);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:.18s;}
.btn.ghost{background:rgba(255,255,255,0.05);color:var(--muted);border-color:rgba(255,255,255,0.09);}
.btn.danger{background:rgba(255,79,110,0.12);color:var(--red);border-color:rgba(255,79,110,0.28);}
.btn.blue{background:rgba(96,165,250,0.12);color:var(--blue);border-color:rgba(96,165,250,0.28);}
.btn.sm{padding:5px 10px;font-size:11px;border-radius:7px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block;}
.badge.ok{background:rgba(34,211,114,0.12);color:var(--green);}
.badge.warn{background:rgba(245,158,11,0.12);color:var(--orange);}
.badge.err{background:rgba(255,79,110,0.12);color:var(--red);}
.pulse{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pulse.on{background:var(--green);box-shadow:0 0 14px var(--green);animation:pa 2s infinite;}
.pulse.off{background:var(--red);}
.pulse.wait{background:var(--orange);animation:pa 1s infinite;}
@keyframes pa{0%,100%{opacity:1;}50%{opacity:.3;}}

/* KPI Widget */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:12px;margin-bottom:16px;}
.kpi-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;}
.kpi-val{font-size:20px;font-weight:700;}
.kpi-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;}

/* Tables / Mobile Cards */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
th{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--dimmed);border-bottom:1px solid rgba(255,255,255,0.06);}
@media(max-width:640px){
  thead{display:none;}
  tr{display:block;padding:12px;background:rgba(255,255,255,0.02);border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.05);}
  td{display:block;border:none;padding:4px 0;}
  td:last-child{display:flex;justify-content:flex-end;gap:8px;}
}
.poster{width:32px;height:46px;object-fit:cover;border-radius:5px;}
.uavatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,0.09);}
.uavatar-ph{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);border:1px solid rgba(255,255,255,0.09);}

/* Modals & Toasts */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.modal-bg.open{display:flex;}
.modal{background:rgba(11,13,22,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:30px;width:100%;max-width:430px;box-shadow:0 24px 80px rgba(0,0,0,0.8);}
#toast{position:fixed;top:24px;left:50%;transform:translate(-50%, -20px);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.22s;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);}
#toast.show{opacity:1;transform:translate(-50%, 0);}
#toast.s{color:var(--green);border:1px solid rgba(34,211,114,0.3);}
#toast.e{color:var(--red);border:1px solid rgba(255,79,110,0.3);}
#toast.i{color:var(--blue);border:1px solid rgba(96,165,250,0.3);}
</style>
</head>
<body>
<div id="root"></div>

let currentLang = 'fr';
let auth = sessionStorage.getItem('wa_auth') || '';

function t(key) { return DICT[currentLang][key] || key; }

function renderLogin() {
  return `
    <div id="loginPage">
      <div id="loginCard">
        <img class="logo" src="logo.png" alt="">
        <h1>Whatsoverr</h1>
        <form id="loginForm" style="margin-top:28px;">
          <label class="lbl">${t('user')}</label><input type="text" id="lu" required>
          <label class="lbl">${t('pass')}</label><input type="password" id="lp" required>
          <button type="submit" class="btn w-full" style="width:100%">${t('login')}</button>
        </form>
        <div id="loginMsg" style="color:var(--red);text-align:center;margin-top:10px;font-size:12px;"></div>
      </div>
    </div>`;
}

function renderApp() {
  return `
    <div id="app" style="display:block;">
      <div class="header">
        <img src="logo.png" alt="">
        <div><h1>WHATSOVERR</h1><div style="font-size:11px;color:var(--muted)">v2.0 PWA Edition</div></div>
        <div class="header-right"><button class="btn ghost sm" onclick="logout()">${t('logout')}</button></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this,'status')">${t('tab_status')}</button>
        <button class="tab-btn" onclick="switchTab(this,'history')">${t('tab_hist')}</button>
        <button class="tab-btn" onclick="switchTab(this,'users')">${t('tab_users')}</button>
        <button class="tab-btn" onclick="switchTab(this,'settings')">${t('tab_settings')}</button>
      </div>
      
      <!-- STATUT -->
      <div id="tab-status" class="tab-pane active">
        <div class="kpi-row" id="kpiBox"></div>
        <div class="grid2">
          <div class="glass card">
            <div class="card-title">${t('st_wa')}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><div class="pulse wait" id="statusDot"></div><div id="statusTxt" style="font-weight:600">...</div></div>
            <img id="qrImg" src="" style="display:none;width:150px;border-radius:12px;margin-bottom:10px;">
            <div class="btn-row">
              <button class="btn ghost sm" onclick="doRestart(false)">${t('st_restart')}</button>
              <button class="btn danger sm" onclick="doRestart(true)">${t('st_purge')}</button>
            </div>
          </div>
          <div class="glass card">
            <div class="card-title">${t('st_disc')}</div>
            <div><label class="lbl">Webhook URL</label><input type="text" id="discordUrl" placeholder="https://discord.com/api/webhooks/..."></div>
            <div class="btn-row"><button class="btn sm" onclick="saveDiscord()">${t('st_save')}</button><button class="btn ghost sm" onclick="testDiscord()">${t('st_test')}</button></div>
          </div>
        </div>
        <div class="glass card" style="margin-top:16px;">
          <div class="card-title">${t('st_ov')}</div>
          <div class="input-row">
            <div><label class="lbl">URL</label><input type="text" id="overseerrUrl" placeholder="http://192.168.1.1:5055"></div>
            <div><label class="lbl">API Key</label><input type="text" id="overseerrApiKey" placeholder="••••••••••••••••"></div>
          </div>
          <div class="btn-row"><button class="btn" onclick="saveOverseerr()">${t('st_save')}</button><button class="btn ghost" onclick="testOverseerr()">${t('st_test')}</button></div>
        </div>
      </div>

      <!-- HISTORIQUE -->
      <div id="tab-history" class="tab-pane">
        <div class="glass card">
          <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
            <div class="card-title" style="margin:0">${t('hist_title')}</div>
            <button class="btn ghost sm" onclick="refreshHistory()">${t('hist_refresh')}</button>
          </div>
          <div class="table-wrap">
            <table><tbody id="histBody"></tbody></table>
          </div>
        </div>
      </div>

      <!-- UTILISATEURS -->
      <div id="tab-users" class="tab-pane">
        <div class="glass card">
          <div class="card-title">${t('usr_add')}</div>
          <div class="input-row">
            <div><label class="lbl">${t('usr_email')}</label><input type="email" id="newEmail" placeholder="ami@gmail.com"></div>
            <div><label class="lbl">${t('usr_phone')}</label><input type="text" id="newPhone" placeholder="33612345678 (sans +)"></div>
            <div style="flex:0.5;min-width:70px"><label class="lbl">Lang</label><select id="newLang"><option value="fr">FR</option><option value="en">EN</option></select></div>

          <div class="card-title">${t('set_tpl')}</div>

            <div><label class="lbl">EN Template</label><textarea id="tpl_en"></textarea></div>

          <div style="margin-top:10px;"><button class="btn" onclick="saveTemplates()">${t('st_save')}</button></div>
        </div>
        
        <div class="glass card">
          <div class="card-title">${t('set_dnd')}</div>
          <div class="input-row">

            <div><label class="lbl">${t('dnd_end')}</label><input type="time" id="dnd_e"></div>
          </div>
          <button class="btn" onclick="saveConfig()">${t('st_save')}</button>

        <label class="lbl">${t('usr_email')}</label><input type="email" id="editEmail">
        <label class="lbl">${t('usr_phone')}</label><input type="text" id="editPhone">
        <label class="lbl">Lang</label><select id="editLang"><option value="fr">FR</option><option value="en">EN</option></select>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn" onclick="saveEdit()">${t('st_save')}</button>
          <button class="btn ghost" onclick="closeEdit()">Annuler</button>
        </div>
      </div>
    </div>
    
    <div id="toast"></div>
  `;
}

// --- Logic ---
let toastT;
function toast(m, c='s') { let e=document.getElementById('toast'); e.textContent=m; e.className='show '+c; clearTimeout(toastT); toastT=setTimeout(()=>e.className='', 3000); }
async function api(url, o={}) {
  let r = await fetch('/dashboard/api'+url, { ...o, headers: { Authorization: auth, 'Content-Type': 'application/json', ...(o.headers||{}) }});
  if(r.status===401) { sessionStorage.removeItem('wa_auth'); location.reload(); }
  return r.json();
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function logout(){ sessionStorage.removeItem('wa_auth'); location.reload(); }
function switchTab(btn, n) {
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active'); btn.classList.add('active');
}

function doRestart(wipe) { if(confirm(wipe?'Purger?':'Restart?')){ api(wipe?'/restart-wipe':'/restart',{method:'POST'}); toast('Reboot...'); setTimeout(()=>location.reload(), 4000); } }

async function saveDiscord(){ await api('/config',{method:'POST',body:JSON.stringify({discordWebhookUrl:document.getElementById('discordUrl').value})}); toast('OK'); }
async function testDiscord(){ 
  let r = await api('/config/test-discord',{method:'POST'}); 
  if(r.error) toast(r.error, 'e'); else toast('OK'); 
}

async function saveOverseerr(){ await api('/config/overseerr',{method:'POST',body:JSON.stringify({overseerrUrl:document.getElementById('overseerrUrl').value, overseerrApiKey:document.getElementById('overseerrApiKey').value})}); toast('OK'); }
async function testOverseerr(){ let r=await api('/overseerr/test',{method:'POST'}); if(r.ok)toast('OK'); else toast(r.error||'Err','e'); }

async function saveTemplates(){ await api('/config/templates',{method:'POST',body:JSON.stringify({templates:{fr:document.getElementById('tpl_fr').value,en:document.getElementById('tpl_en').value}})}); toast('OK'); }
async function saveConfig(){ await api('/config',{method:'POST',body:JSON.stringify({dnd:{enabled:document.getElementById('dnd_en').value==='true',start:document.getElementById('dnd_s').value,end:document.getElementById('dnd_e').value}})}); toast('OK'); }

async function testManual(){ 
  let p = document.getElementById('testPhone').value;
  if(!p) return toast('Entrez un numéro', 'e');
  let r = await api('/whatsapp/test',{method:'POST',body:JSON.stringify({phone:p, message:'TEST WhatsApp Bot'})}); 
  if(r.error) toast(r.error, 'e'); else toast('Test Envoyé'); 
}

function changeDashLang() {
  currentLang = document.getElementById('dashLang').value;
  api('/config',{method:'POST',body:JSON.stringify({dashboardLang:currentLang})});
  renderFull();
}

async function exportData() {
  let d = await api('/config/export');
  let b = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
  let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'whatsoverr_backup.json'; a.click();
}
async function importData(e) {
  let f = e.target.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = async (ev) => {
    try {
      let j = JSON.parse(ev.target.result);
      await api('/config/import',{method:'POST',body:JSON.stringify(j)});
      toast('Import OK, rebooting...'); setTimeout(()=>api('/restart',{method:'POST'}).then(()=>setTimeout(()=>location.reload(),3000)), 1000);
    } catch(err) { toast('Invalid file','e'); }
  };
  r.readAsText(f);
}

// Translations for statuses
function transStatus(st) {
  if (st === 'sent_with_poster') return t('st_sent_img');
  if (st === 'sent_text_only') return t('st_sent_txt');
  if (st === 'queued_dnd') return t('st_queued');
  if (st === 'error') return t('st_err');
  return st;
}

async function refreshHistory() {
  let hs = await api('/history');
  if(!hs) return;
  document.getElementById('histBody').innerHTML = hs.map(h=>{
    let c = h.status.includes('sent')?'ok':(h.status.includes('dnd')?'warn':'err');
    let p = h.media_poster?'<img class="poster" src="'+esc(h.media_poster)+'">':'<div class="poster"></div>';
    return `<tr><td style="width:40px">${p}</td><td>${esc(h.requestedBy_username||'?')}</td><td>${esc(h.media_title||'?')}</td><td style="text-align:right"><span class="badge ${c}">${esc(transStatus(h.status))}</span></td></tr>`;
  }).join('');
  
  let sent = hs.filter(h=>h.status.includes('sent')).length;
  let rate = hs.length ? Math.round((sent/hs.length)*100) : 0;
  let last = hs.length ? hs[0].requestedBy_username : '--';
  document.getElementById('kpiBox').innerHTML = `
    <div class="kpi-card"><span class="kpi-lbl">${t('kpi_sent')}</span><span class="kpi-val">${sent}</span></div>
    <div class="kpi-card"><span class="kpi-lbl">${t('kpi_rate')}</span><span class="kpi-val">${rate}%</span></div>
    <div class="kpi-card"><span class="kpi-lbl">${t('kpi_last')}</span><span class="kpi-val" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(last)}</span></div>
  `;
}

async function refreshUsers() {
  let us = await api('/users');
  if(!us) return;
  document.getElementById('usersBody').innerHTML = us.map(u=>{
    let av = u.avatar?'<img class="uavatar" src="'+esc(u.avatar)+'">':'<div class="uavatar-ph">'+u.email[0].toUpperCase()+'</div>';
    return `<tr><td style="width:40px">${av}</td><td>${esc(u.email)}<br><span style="color:var(--muted);font-size:11px">+${esc(u.phone)} · ${esc(u.lang).toUpperCase()}</span></td>
    <td style="text-align:right">
      <button class="btn ghost sm" onclick="openEdit('${esc(u.email)}','${esc(u.phone)}','${esc(u.lang)}')">${t('btn_edit')}</button>
      <button class="btn danger sm" onclick="api('/users/'+encodeURIComponent('${esc(u.email)}'),{method:'DELETE'}).then(refreshUsers)">X</button>
    </td></tr>`;
  }).join('');
}

// EDIT USER MODAL
function openEdit(email, phone, lang) {
  document.getElementById('editOld').value = email;
  document.getElementById('editEmail').value = email;
  document.getElementById('editPhone').value = phone;
  document.getElementById('editLang').value = lang || 'fr';
  document.getElementById('editModal').classList.add('open');
}
function closeEdit() { document.getElementById('editModal').classList.remove('open'); }
async function saveEdit() {
  let old = document.getElementById('editOld').value;
  let email = document.getElementById('editEmail').value;
  let phone = document.getElementById('editPhone').value;
  let lang = document.getElementById('editLang').value;
  let r = await api('/users/'+encodeURIComponent(old), {method:'PUT', body:JSON.stringify({email, phone, lang})});
  if(r.saved) { closeEdit(); toast('OK'); refreshUsers(); } else toast(r.error||'Err', 'e');
}

async function addUser() {
  let r=await api('/users',{method:'POST',body:JSON.stringify({email:document.getElementById('newEmail').value,phone:document.getElementById('newPhone').value,lang:document.getElementById('newLang').value})});
  if(r.saved){toast('OK');document.getElementById('newEmail').value='';document.getElementById('newPhone').value='';refreshUsers();}else toast(r.error||'Err','e');
}

async function loadOvUsers() {
  document.getElementById('ovLoadBtn').textContent = '...';
  let us=await api('/overseerr/users'); document.getElementById('ovLoadBtn').textContent = t('usr_load');
  if(!us||us.error)return toast(us?.error||'Err','e');
  
  // Rendu de la liste
  document.getElementById('ovList').innerHTML = us.map(u=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.05)" id="ovrow_${u.id}">
    <img src="${u.thumb}" style="width:30px;border-radius:50%"> ${esc(u.title)}
    ${u.registered?'<span class="badge ok" style="margin-left:auto">OK</span>':`
    <div style="margin-left:auto;display:flex;gap:4px;">
      <input type="text" id="ovp_${u.id}" placeholder="336..." style="width:90px;margin:0">
      <select id="ovl_${u.id}" style="width:50px;margin:0"><option value="fr">FR</option><option value="en">EN</option></select>
      <button class="btn sm" onclick="addOvDirect('${u.id}', '${esc(u.email)}', '${esc(u.thumb)}')">Add</button>
    </div>` }
  </div>`).join('');
}

// Add directly from Overseerr list without reloading everything
async function addOvDirect(id, email, thumb) {
  let phone = document.getElementById('ovp_'+id).value;
  let lang = document.getElementById('ovl_'+id).value;
  if (!phone) return toast('Numéro requis', 'e');
  
  let r = await api('/users', {method:'POST', body:JSON.stringify({email, phone, lang, avatar:thumb})});
  if (r.error) {
    toast(r.error, 'e');
  } else {
    toast('OK');
    // Update just this row DOM instead of full reload!
    document.getElementById('ovrow_'+id).innerHTML = `<img src="${thumb}" style="width:30px;border-radius:50%"> ${esc(email)} <span class="badge ok" style="margin-left:auto">OK</span>`;
    refreshUsers(); // Refresh background list
  }
}

async function refreshAll() {
  let st = await api('/status');
  document.getElementById('statusDot').className = st.whatsapp_ready?'pulse on':(st.qr?'pulse wait':'pulse off');
  document.getElementById('statusTxt').textContent = st.whatsapp_ready?t('st_wa_ok'):(st.qr?t('st_wa_wait'):t('st_wa_off'));
  let qr = document.getElementById('qrImg'); if(st.qr){qr.src=st.qr;qr.style.display='block';}else{qr.style.display='none';}

  let cf = await api('/config');
  if(cf.dashboardLang && cf.dashboardLang !== currentLang) { currentLang = cf.dashboardLang; renderFull(); return; }
  
  // Use properties for placeholder instead of clearing value
  document.getElementById('discordUrl').placeholder = cf.hasWebhook?cf.maskedUrl:'https://discord.com/api/webhooks/...';
  document.getElementById('overseerrApiKey').placeholder = cf.hasOverseerrApiKey?cf.maskedApiKey:'••••••••••••••••';
  document.getElementById('dashLang').value = currentLang;
  
  if(cf.templates) { document.getElementById('tpl_fr').value = cf.templates.fr||''; document.getElementById('tpl_en').value = cf.templates.en||''; }
  if(cf.dnd) { document.getElementById('dnd_en').value = cf.dnd.enabled?'true':'false'; document.getElementById('dnd_s').value = cf.dnd.start; document.getElementById('dnd_e').value = cf.dnd.end; }
  if(cf.overseerrUrl) { document.getElementById('overseerrUrl').value = cf.overseerrUrl; }

  refreshHistory(); refreshUsers();
}

function renderFull() {
  if(!auth) {
    document.getElementById('root').innerHTML = renderLogin();
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault(); auth = 'Basic '+btoa(document.getElementById('lu').value+':'+document.getElementById('lp').value);
      let r = await fetch('/dashboard/api/status',{headers:{Authorization:auth}});
      if(r.ok){ sessionStorage.setItem('wa_auth',auth); renderFull(); } else document.getElementById('loginMsg').textContent = 'Invalid credentials';
    };
  } else {
    document.getElementById('root').innerHTML = renderApp();
    refreshAll();
    setInterval(refreshAll, 10000);
  }
}
renderFull();
</script>
